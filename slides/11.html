<h2 id="%E7%A4%BE%E4%BC%9A%E8%AA%BF%E6%9F%BB%E5%85%A5%E9%96%80">社会調査入門</h2>

<header>社会調査入門｜北星学園大学 2026年度後期</header>
<h2 id="%E6%9C%AC%E6%97%A5%E3%81%AE%E5%AD%A6%E7%BF%92%E7%9B%AE%E6%A8%99">本日の学習目標</h2>
<ol>
<li>アンケート調査（質問紙調査）の特徴と適用場面を理解する</li>
<li>実施方法の種類と、それぞれの長所・短所を比較できる</li>
<li>良い質問文と悪い質問文の違いを説明できる</li>
<li>尺度の種類とリッカート尺度の設計ができる</li>
<li>実際の調査票を読んで、その設計意図を考察できる</li>
<li><strong>標本誤差と非標本誤差</strong>を区別し、「誤差 ±3%」が何を指しているかを説明できる</li>
<li>非標本誤差が<strong>調査のどの工程で入るか</strong>を、計画から公表まで順に挙げられる</li>
</ol>
<footer>小野原 彩香</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="3" data-paginate="true" data-header="社会調査入門｜北星学園大学 2026年度後期" data-footer="小野原 彩香" data-theme="default" lang="ja-JP" data-marpit-pagination="3" style="--paginate:true;--header:社会調査入門｜北星学園大学 2026年度後期;--footer:小野原 彩香;--theme:default;" data-marpit-pagination-total="34">
<header>社会調査入門｜北星学園大学 2026年度後期</header>
<h2 id="1-%E3%82%A2%E3%83%B3%E3%82%B1%E3%83%BC%E3%83%88%E8%AA%BF%E6%9F%BB%E3%81%A8%E3%81%AF%E4%BD%95%E3%81%8B">1. アンケート調査とは何か</h2>
<p>**質問紙調査（アンケート調査）**とは、あらかじめ用意した質問項目を調査対象者に提示し、回答を収集することで情報を得る調査方法。</p>
<h3 id="%E7%89%B9%E5%BE%B4">特徴</h3>
<ul>
<li><strong>標準化</strong>：全員に同じ質問を同じ順序で提示する</li>
<li><strong>大規模性</strong>：多数の対象者から同時にデータを収集できる</li>
<li><strong>定量化</strong>：回答を数値化して統計的に分析できる</li>
<li><strong>再現性</strong>：同じ調査を繰り返すことができる（追跡調査）</li>
</ul>
<footer>小野原 彩香</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="4" data-paginate="true" data-header="社会調査入門｜北星学園大学 2026年度後期" data-footer="小野原 彩香" data-theme="default" lang="ja-JP" data-marpit-pagination="4" style="--paginate:true;--header:社会調査入門｜北星学園大学 2026年度後期;--footer:小野原 彩香;--theme:default;" data-marpit-pagination-total="34">
<header>社会調査入門｜北星学園大学 2026年度後期</header>
<h2 id="%E3%82%A2%E3%83%B3%E3%82%B1%E3%83%BC%E3%83%88%E8%AA%BF%E6%9F%BB%E3%81%8C%E9%81%A9%E3%81%97%E3%81%A6%E3%81%84%E3%82%8B%E5%A0%B4%E9%9D%A2">アンケート調査が適している場面</h2>
<table>
<thead>
<tr>
<th>適している場面</th>
<th>適していない場面</th>
</tr>
</thead>
<tbody>
<tr>
<td>意見・態度の分布を知りたい</td>
<td>深層心理や複雑な動機を探りたい</td>
</tr>
<tr>
<td>多数の対象者から同時に収集</td>
<td>少数事例を深く理解したい</td>
</tr>
<tr>
<td>変数間の関連を統計的に検討</td>
<td>文脈依存的な意味を解釈したい</td>
</tr>
<tr>
<td>時系列での変化を追跡したい</td>
<td>観察や相互作用を記録したい</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>問い）</strong> 「大学生の読書時間と成績の関連を知りたい」場合、アンケート調査は有効か？</p>
</blockquote>
<footer>小野原 彩香</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="5" data-paginate="true" data-header="社会調査入門｜北星学園大学 2026年度後期" data-footer="小野原 彩香" data-theme="default" lang="ja-JP" data-marpit-pagination="5" style="--paginate:true;--header:社会調査入門｜北星学園大学 2026年度後期;--footer:小野原 彩香;--theme:default;" data-marpit-pagination-total="34">
<header>社会調査入門｜北星学園大学 2026年度後期</header>
<h2 id="2-%E5%AE%9F%E6%96%BD%E6%96%B9%E6%B3%95%E3%81%AE%E7%A8%AE%E9%A1%9E1">2. 実施方法の種類（1）</h2>
<h3 id="%E9%83%B5%E9%80%81%E8%AA%BF%E6%9F%BB">郵送調査</h3>
<ul>
<li>質問紙を郵送し、記入後に返送してもらう</li>
<li><strong>利点</strong>：広域に低コストで実施、匿名性が高い</li>
<li><strong>欠点</strong>：回収率が低い（20〜40%程度）、回答者の誤解を修正できない</li>
</ul>
<h3 id="%E7%95%99%E7%BD%AE%E8%AA%BF%E6%9F%BB">留置調査</h3>
<ul>
<li>調査員が質問紙を手渡し、後日回収する</li>
<li><strong>利点</strong>：回収率が比較的高い（50〜70%程度）</li>
<li><strong>欠点</strong>：調査員の訪問コスト、調査員効果のリスク</li>
</ul>
<footer>小野原 彩香</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="6" data-paginate="true" data-header="社会調査入門｜北星学園大学 2026年度後期" data-footer="小野原 彩香" data-theme="default" lang="ja-JP" data-marpit-pagination="6" style="--paginate:true;--header:社会調査入門｜北星学園大学 2026年度後期;--footer:小野原 彩香;--theme:default;" data-marpit-pagination-total="34">
<header>社会調査入門｜北星学園大学 2026年度後期</header>
<h2 id="2-%E5%AE%9F%E6%96%BD%E6%96%B9%E6%B3%95%E3%81%AE%E7%A8%AE%E9%A1%9E2">2. 実施方法の種類（2）</h2>
<h3 id="%E9%9D%A2%E6%8E%A5%E8%AA%BF%E6%9F%BB">面接調査</h3>
<ul>
<li>調査員が口頭で質問し、回答を記録する</li>
<li><strong>利点</strong>：回収率が最も高い、複雑な質問に対応できる</li>
<li><strong>欠点</strong>：費用・時間がかかる、社会的望ましさバイアス</li>
</ul>
<h3 id="%E9%9B%BB%E8%A9%B1%E8%AA%BF%E6%9F%BBrdd%E6%B3%95%E3%81%AA%E3%81%A9">電話調査（RDD法など）</h3>
<ul>
<li>電話で調査員が質問する</li>
<li><strong>利点</strong>：迅速に実施できる、広域対応</li>
<li><strong>欠点</strong>：固定電話離れ、長時間の調査が困難</li>
</ul>
<h3 id="web%E8%AA%BF%E6%9F%BB">Web調査</h3>
<ul>
<li>オンラインフォームで回答を収集する</li>
<li><strong>利点</strong>：低コスト、自動集計、画像・動画の挿入も可能</li>
<li><strong>欠点</strong>：サンプル偏り（インターネット利用者のみ）、無作為抽出が難しい</li>
</ul>
<footer>小野原 彩香</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="7" data-paginate="true" data-header="社会調査入門｜北星学園大学 2026年度後期" data-footer="小野原 彩香" data-theme="default" lang="ja-JP" data-marpit-pagination="7" style="--paginate:true;--header:社会調査入門｜北星学園大学 2026年度後期;--footer:小野原 彩香;--theme:default;" data-marpit-pagination-total="34">
<header>社会調査入門｜北星学園大学 2026年度後期</header>
<h2 id="%E8%AA%BF%E6%9F%BB%E6%96%B9%E6%B3%95%E3%81%AE%E6%AF%94%E8%BC%83">調査方法の比較</h2>
<table>
<thead>
<tr>
<th>方法</th>

<th>費用</th>
<th>バイアスのリスク</th>

</tr>
</thead>
<tbody>
<tr>
<td>郵送</td>
<td>低</td>
<td>低</td>
<td>自己選択</td>
<td>中</td>
</tr>
<tr>
<td>留置</td>
<td>中〜高</td>
<td>中</td>
<td>調査員効果</td>
<td>中</td>
</tr>
<tr>
<td>面接</td>
<td>高</td>
<td>高</td>
<td>社会的望ましさ</td>
<td>高</td>
</tr>
<tr>
<td>電話</td>
<td>中</td>
<td>中</td>
<td>カバレッジ</td>
<td>低</td>
</tr>
<tr>
<td>Web</td>
<td>低〜中</td>
<td>非常に低</td>
<td>サンプル偏り</td>
<td>中</td>
</tr>
</tbody>
</table>
<footer>小野原 彩香</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="8" data-paginate="true" data-header="社会調査入門｜北星学園大学 2026年度後期" data-footer="小野原 彩香" data-theme="default" lang="ja-JP" data-marpit-pagination="8" style="--paginate:true;--header:社会調査入門｜北星学園大学 2026年度後期;--footer:小野原 彩香;--theme:default;" data-marpit-pagination-total="34">
<header>社会調査入門｜北星学園大学 2026年度後期</header>
<h2 id="3-%E8%B3%AA%E5%95%8F%E9%A0%85%E7%9B%AE%E3%81%AE%E8%A8%AD%E8%A8%88%E9%96%89%E3%81%98%E3%81%9F%E8%B3%AA%E5%95%8F%E3%81%A8%E9%96%8B%E3%81%84%E3%81%9F%E8%B3%AA%E5%95%8F">3. 質問項目の設計：閉じた質問と開いた質問</h2>
<h3 id="%E9%96%89%E3%81%98%E3%81%9F%E8%B3%AA%E5%95%8F%E5%B0%81%E9%8E%96%E5%9E%8B">閉じた質問（封鎖型）</h3>
<ul>
<li>選択肢を提示し、その中から選ばせる</li>
<li>例：「あなたは週に何日アルバイトをしますか？ ①0日 ②1〜2日 ③3〜4日 ④5日以上」</li>
<li>集計・比較が容易、回答の標準化が可能</li>
</ul>
<h3 id="%E9%96%8B%E3%81%84%E3%81%9F%E8%B3%AA%E5%95%8F%E8%87%AA%E7%94%B1%E5%9B%9E%E7%AD%94%E5%9E%8B">開いた質問（自由回答型）</h3>
<ul>
<li>自由に記述させる</li>
<li>例：「アルバイトを通じてどのようなことを学びましたか？」</li>
<li>深い情報を得られるが、集計・分類に手間がかかる</li>
</ul>
<blockquote>
<p><strong>実践のポイント</strong>：大規模調査では閉じた質問が中心。開いた質問は補足的・探索的に使う。</p>
</blockquote>
<footer>小野原 彩香</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="9" data-paginate="true" data-header="社会調査入門｜北星学園大学 2026年度後期" data-footer="小野原 彩香" data-theme="default" lang="ja-JP" data-marpit-pagination="9" style="--paginate:true;--header:社会調査入門｜北星学園大学 2026年度後期;--footer:小野原 彩香;--theme:default;" data-marpit-pagination-total="34">
<header>社会調査入門｜北星学園大学 2026年度後期</header>
<h2 id="4-%E5%B0%BA%E5%BA%A6%E3%81%AE%E7%A8%AE%E9%A1%9E">4. 尺度の種類</h2>
<table>
<thead>
<tr>
<th>尺度</th>
<th>特徴</th>
<th>例</th>
<th>使える統計</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>名義尺度</strong></td>
<td>カテゴリの区別のみ</td>
<td>性別、出身地、専攻</td>
<td>最頻値、クロス集計</td>
</tr>
<tr>
<td><strong>順序尺度</strong></td>
<td>順序に意味あり、間隔は不明</td>
<td>満足度ランキング、学年</td>
<td>中央値、順位相関</td>
</tr>
<tr>
<td><strong>間隔尺度</strong></td>
<td>等間隔だが0に意味なし</td>
<td>気温、年号</td>
<td>平均値、標準偏差</td>
</tr>
<tr>
<td><strong>比率尺度</strong></td>
<td>等間隔かつ絶対0がある</td>
<td>収入、年齢、時間</td>
<td>全統計量</td>
</tr>
</tbody>
</table>
<blockquote>
<p><strong>重要</strong>：尺度の種類によって使える統計分析が異なる。データを収集する前に確認すること！</p>
</blockquote>
<footer>小野原 彩香</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="10" data-paginate="true" data-header="社会調査入門｜北星学園大学 2026年度後期" data-footer="小野原 彩香" data-theme="default" lang="ja-JP" data-marpit-pagination="10" style="--paginate:true;--header:社会調査入門｜北星学園大学 2026年度後期;--footer:小野原 彩香;--theme:default;" data-marpit-pagination-total="34">
<header>社会調査入門｜北星学園大学 2026年度後期</header>
<h2 id="5-%E3%83%AA%E3%83%83%E3%82%AB%E3%83%BC%E3%83%88%E5%B0%BA%E5%BA%A6%E3%81%AE%E4%BD%9C%E3%82%8A%E6%96%B9">5. リッカート尺度の作り方</h2>
<p><strong>リッカート尺度（Likert scale）</strong>：態度・意見の強度を段階的に測定する</p>
<h3 id="%E5%85%B8%E5%9E%8B%E7%9A%84%E3%81%AA%E5%BD%A2%E5%BC%8F5%E6%AE%B5%E9%9A%8E">典型的な形式（5段階）</h3>
<blockquote>
<p>「大学での学習は将来の仕事に役立つと思う」</p>
<p>①まったくそう思わない　②そう思わない　③どちらでもない　④そう思う　⑤非常にそう思う</p>
</blockquote>
<h3 id="%E8%A8%AD%E8%A8%88%E4%B8%8A%E3%81%AE%E6%B3%A8%E6%84%8F%E7%82%B9">設計上の注意点</h3>
<ul>
<li><strong>奇数段階 vs 偶数段階</strong>：中間選択肢（「どちらでもない」）を置くかどうか</li>
<li><strong>段階数</strong>：4段階・5段階・7段階が一般的</li>
<li><strong>ラベルの対称性</strong>：ポジティブ側とネガティブ側を対称に</li>
<li><strong>逆転項目</strong>：一部の項目を逆方向に表現して回答の一貫性を確認する</li>
</ul>
<footer>小野原 彩香</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="11" data-paginate="true" data-header="社会調査入門｜北星学園大学 2026年度後期" data-footer="小野原 彩香" data-theme="default" lang="ja-JP" data-marpit-pagination="11" style="--paginate:true;--header:社会調査入門｜北星学園大学 2026年度後期;--footer:小野原 彩香;--theme:default;" data-marpit-pagination-total="34">
<header>社会調査入門｜北星学園大学 2026年度後期</header>
<h2 id="6-%E6%82%AA%E3%81%84%E8%B3%AA%E5%95%8F%E3%81%AE%E5%85%B8%E5%9E%8B%E4%BE%8B">6. 悪い質問の典型例</h2>
<h3 id="%E3%83%80%E3%83%96%E3%83%AB%E3%83%90%E3%83%BC%E3%83%AC%E3%83%AB%E8%B3%AA%E5%95%8Fdouble-barreled-question">ダブルバーレル質問（double-barreled question）</h3>
<ul>
<li>一つの質問に二つの内容が含まれる</li>
<li><strong>悪例</strong>：「この授業は内容が充実していて、教え方もわかりやすいと思いますか？」</li>
<li><strong>問題</strong>：内容と教え方への評価が分離できない</li>
</ul>
<h3 id="%E8%AA%98%E5%B0%8E%E8%B3%AA%E5%95%8Fleading-question">誘導質問（leading question）</h3>
<ul>
<li>特定の回答を誘導してしまう</li>
<li><strong>悪例</strong>：「多くの専門家が推奨しているこの政策に、あなたは賛成しますか？」</li>
<li><strong>問題</strong>：「多くの専門家が推奨している」という情報が回答を偏らせる</li>
</ul>
<h3 id="%E5%90%A6%E5%AE%9A%E3%81%AE%E5%90%A6%E5%AE%9Adouble-negatives">否定の否定（double negatives）</h3>
<ul>
<li><strong>悪例</strong>：「核廃絶に反対しないとは言えないと思いますか？」</li>
<li><strong>問題</strong>：意味が複雑で、回答者が混乱する</li>
</ul>
<footer>小野原 彩香</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="12" data-paginate="true" data-header="社会調査入門｜北星学園大学 2026年度後期" data-footer="小野原 彩香" data-theme="default" lang="ja-JP" data-marpit-pagination="12" style="--paginate:true;--header:社会調査入門｜北星学園大学 2026年度後期;--footer:小野原 彩香;--theme:default;" data-marpit-pagination-total="34">
<header>社会調査入門｜北星学園大学 2026年度後期</header>
<h2 id="%E6%82%AA%E3%81%84%E8%B3%AA%E5%95%8F%E3%81%AE%E5%85%B8%E5%9E%8B%E4%BE%8B4%E6%9B%96%E6%98%A7%E3%81%AA%E7%94%A8%E8%AA%9E">悪い質問の典型例（4）：曖昧な用語</h2>
<h3 id="%E6%82%AA%E4%BE%8B%E5%A4%A7%E3%81%8D%E3%81%AA%E6%94%BF%E5%BA%9C%E3%81%AB%E8%B3%9B%E6%88%90%E3%81%A7%E3%81%99%E3%81%8B"><strong>悪例</strong>：「大きな政府に賛成ですか？」</h3>
<p>「大きな政府」が指すものが人によって違う</p>
<ul>
<li>福祉の充実と読む人</li>
<li>増税と読む人</li>
<li>規制の強化と読む人</li>
</ul>
<h3 id="%E5%85%A8%E5%93%A1%E3%81%8C%E5%90%8C%E3%81%98%E8%B3%AA%E5%95%8F%E3%81%AB%E7%AD%94%E3%81%88%E3%81%A6%E3%81%84%E3%82%8B%E3%81%93%E3%81%A8%E3%81%AB%E3%81%AA%E3%81%A3%E3%81%A6%E3%81%84%E3%81%AA%E3%81%84"><strong>全員が同じ質問に答えていることになっていない</strong></h3>
<p>集計すると一つの数字が出るので、<strong>答えが揃っているように見えてしまう</strong>のが厄介</p>
<p>専門用語に限らず「若者」「地域」「格差」「負担」などの日常語でも起きる<br />
→ 使うなら<strong>定義を質問文の中に書く</strong></p>
<footer>小野原 彩香</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="13" data-paginate="true" data-header="社会調査入門｜北星学園大学 2026年度後期" data-footer="小野原 彩香" data-theme="default" lang="ja-JP" data-marpit-pagination="13" style="--paginate:true;--header:社会調査入門｜北星学園大学 2026年度後期;--footer:小野原 彩香;--theme:default;" data-marpit-pagination-total="34">
<header>社会調査入門｜北星学園大学 2026年度後期</header>
<h2 id="7-%E8%B3%AA%E5%95%8F%E6%96%87%E3%82%92%E6%9B%B8%E3%81%8F%E3%81%A8%E3%81%8D%E3%81%AEkiss%E5%8E%9F%E5%89%87%E3%81%A8%E6%B3%A8%E6%84%8F%E7%82%B9">7. 質問文を書くときのKISS原則と注意点</h2>
<p><strong>KISS原則</strong>：Keep It Simple and Straightforward（シンプルに、明確に）</p>
<h3 id="%E5%85%B7%E4%BD%93%E7%9A%84%E3%81%AA%E3%83%81%E3%82%A7%E3%83%83%E3%82%AF%E3%83%AA%E3%82%B9%E3%83%88">具体的なチェックリスト</h3>
<ul>
<li>[ ] 専門用語・略語を使っていないか（または説明を付けているか）</li>
<li>[ ] 一文に一つの内容のみか（ダブルバーレルでないか）</li>
<li>[ ] 特定の回答を誘導していないか（中立的な表現か）</li>
<li>[ ] 全員に当てはまる質問か（フィルター質問を適切に配置しているか）</li>
<li>[ ] 記憶に頼りすぎた質問ではないか（参照期間が明確か）</li>
<li>[ ] 社会的に望ましい方向へのバイアスはないか</li>
</ul>
<footer>小野原 彩香</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="14" data-paginate="true" data-header="社会調査入門｜北星学園大学 2026年度後期" data-footer="小野原 彩香" data-theme="default" lang="ja-JP" data-marpit-pagination="14" style="--paginate:true;--header:社会調査入門｜北星学園大学 2026年度後期;--footer:小野原 彩香;--theme:default;" data-marpit-pagination-total="34">
<header>社会調査入門｜北星学園大学 2026年度後期</header>
<h2 id="8-%E8%B3%AA%E5%95%8F%E3%81%AE%E9%A0%86%E5%BA%8F%E5%8A%B9%E6%9E%9C%E3%81%A8%E3%82%A2%E3%83%B3%E3%82%AB%E3%83%AA%E3%83%B3%E3%82%B0">8. 質問の順序効果とアンカリング</h2>
<h3 id="%E9%A0%86%E5%BA%8F%E5%8A%B9%E6%9E%9Corder-effect">順序効果（order effect）</h3>
<ul>
<li>前の質問が後の質問の回答に影響を与える現象</li>
<li><strong>例</strong>：幸福感について聞いた後に恋愛満足度を聞くと、<strong>前者の影響が後者に出る</strong></li>
</ul>
<h3 id="%E3%82%A2%E3%83%B3%E3%82%AB%E3%83%AA%E3%83%B3%E3%82%B0anchoring">アンカリング（anchoring）</h3>
<ul>
<li>最初に提示された数値・情報が判断の基準（アンカー）になる</li>
<li><strong>例</strong>：「年収800万円以上ですか？」と先に聞かれた人は、「年収200万円以上ですか？」と聞かれた人より<strong>収入を高く申告しやすい</strong></li>
</ul>
<h3 id="%E5%AF%BE%E5%87%A6%E6%B3%95">対処法</h3>
<ul>
<li>重要な質問は序盤に配置する</li>
<li>ランダマイズ（質問順序の無作為化）を行う</li>
<li>フィラー質問を挟んで前の質問の影響を薄める</li>
</ul>
<footer>小野原 彩香</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="15" data-paginate="true" data-header="社会調査入門｜北星学園大学 2026年度後期" data-footer="小野原 彩香" data-theme="default" lang="ja-JP" data-marpit-pagination="15" style="--paginate:true;--header:社会調査入門｜北星学園大学 2026年度後期;--footer:小野原 彩香;--theme:default;" data-marpit-pagination-total="34">
<header>社会調査入門｜北星学園大学 2026年度後期</header>
<h2 id="%E9%A0%86%E5%BA%8F%E5%8A%B9%E6%9E%9C%E3%81%AE%E5%85%B7%E4%BD%93%E4%BE%8B">順序効果の具体例</h2>
<p>同じ「<strong>原子力発電に賛成か</strong>」を聞いても、<strong>直前に何を聞いたか</strong>で答えが動く</p>
<table>
<thead>
<tr>
<th>直前に聞いたこと</th>
<th>回答者が置かれる枠</th>
</tr>
</thead>
<tbody>
<tr>
<td>地球温暖化について</td>
<td>「CO₂を出さない電源」</td>
</tr>
<tr>
<td>平和運動・核兵器について</td>
<td>「核」</td>
</tr>
</tbody>
</table>
<br />
<h3 id="%E8%B3%AA%E5%95%8F%E6%96%87%E3%81%AF%E4%B8%80%E5%AD%97%E3%82%82%E5%A4%89%E3%81%88%E3%81%A6%E3%81%84%E3%81%AA%E3%81%84%E5%A4%89%E3%81%88%E3%81%9F%E3%81%AE%E3%81%AF%E9%A0%86%E7%95%AA%E3%81%A0%E3%81%91">質問文は一字も変えていない。変えたのは順番だけ</h3>
<footer>小野原 彩香</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="16" data-paginate="true" data-header="社会調査入門｜北星学園大学 2026年度後期" data-footer="小野原 彩香" data-class="lead" data-theme="default" lang="ja-JP" class="lead" data-marpit-pagination="16" style="--paginate:true;--header:社会調査入門｜北星学園大学 2026年度後期;--footer:小野原 彩香;--class:lead;--theme:default;" data-marpit-pagination-total="34">
<header>社会調査入門｜北星学園大学 2026年度後期</header>

<h1 id="%E8%AA%A4%E5%B7%AE%E3%81%AF%E3%81%A9%E3%81%93%E3%81%A7%E5%85%A5%E3%82%8B%E3%81%AE%E3%81%8B">誤差はどこで入るのか</h1>

</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="17" data-paginate="true" data-header="社会調査入門｜北星学園大学 2026年度後期" data-footer="小野原 彩香" data-theme="default" lang="ja-JP" data-marpit-pagination="17" style="--paginate:true;--header:社会調査入門｜北星学園大学 2026年度後期;--footer:小野原 彩香;--theme:default;" data-marpit-pagination-total="34">
<header>社会調査入門｜北星学園大学 2026年度後期</header>
<h2 id="%E6%A8%99%E6%9C%AC%E8%AA%A4%E5%B7%AE%E3%81%A8%E9%9D%9E%E6%A8%99%E6%9C%AC%E8%AA%A4%E5%B7%AE">標本誤差と非標本誤差</h2>
<table>
<thead>
<tr>
<th></th>
<th>何か</th>
<th>性質</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>標本誤差</strong></td>
<td>母集団の一部しか見ていないことから生じるランダムなずれ</td>

<header>社会調査入門｜北星学園大学 2026年度後期</header>
<h2 id="%E8%AA%A4%E5%B7%AE-%C2%B131%E3%81%AB%E9%9D%9E%E6%A8%99%E6%9C%AC%E8%AA%A4%E5%B7%AE%E3%81%AF%E5%85%A5%E3%81%A3%E3%81%A6%E3%81%84%E3%81%AA%E3%81%84">「誤差 ±3.1%」に、非標本誤差は入っていない</h2>
<p>支持率の報道にある「誤差 ±3.1%」は <strong>標本誤差だけ</strong></p>
<p>質問文が誘導的だったこと、答えなかった人の偏り、記入ミス、コーディングの揺れ<br />
→ <strong>あの ±3.1% に一切含まれていない</strong></p>
<br />
<h3 id="%E3%81%97%E3%81%8B%E3%82%82%E6%A8%99%E6%9C%AC%E3%82%9210%E5%80%8D%E3%81%AB%E3%81%97%E3%81%A6%E3%82%82%E9%9D%9E%E6%A8%99%E6%9C%AC%E8%AA%A4%E5%B7%AE%E3%81%AF%E6%B8%9B%E3%82%89%E3%81%AA%E3%81%84">しかも、標本を10倍にしても非標本誤差は減らない</h3>
<p>むしろ調査員が増え、入力作業が増えるので、<strong>増える方向に働くことがある</strong></p>
<br />
<p>第10回の <strong>Literary Digest（1936年）は236万人</strong>から回答を得て、それでも外した<br />
→ <strong>数が足りなかったのではなく、非標本誤差（選ばれ方の偏り）で外した</strong></p>
<h3 id="n10000%E3%81%AE%E5%A4%A7%E8%A6%8F%E6%A8%A1%E8%AA%BF%E6%9F%BB%E3%81%A7%E3%81%99%E3%81%AF%E3%81%9D%E3%82%8C%E3%81%A0%E3%81%91%E3%81%A7%E3%81%AF%E5%93%81%E8%B3%AA%E3%81%AE%E4%BF%9D%E8%A8%BC%E3%81%AB%E3%81%AA%E3%82%89%E3%81%AA%E3%81%84">「n=10,000の大規模調査です」は、それだけでは品質の保証にならない</h3>
<footer>小野原 彩香</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="19" data-paginate="true" data-header="社会調査入門｜北星学園大学 2026年度後期" data-footer="小野原 彩香" data-theme="default" lang="ja-JP" data-marpit-pagination="19" style="--paginate:true;--header:社会調査入門｜北星学園大学 2026年度後期;--footer:小野原 彩香;--theme:default;" data-marpit-pagination-total="34">
<header>社会調査入門｜北星学園大学 2026年度後期</header>
<h2 id="%E9%9D%9E%E6%A8%99%E6%9C%AC%E8%AA%A4%E5%B7%AE%E3%81%AE%E7%99%BA%E7%94%9F%E6%BA%90-%E2%80%95%E2%80%95-%E5%B7%A5%E7%A8%8B%E9%A0%86%E3%81%AB">非標本誤差の発生源 ―― 工程順に</h2>
<p>ここまで扱った質問文の問題は、<strong>発生源のひとつ</strong>にすぎない</p>
<table>
<thead>
<tr>
<th>工程</th>
<th>どこで誤差が入るか</th>
<th>どこで扱うか</th>
</tr>
</thead>
<tbody>
<tr>
<td><strong>① 計画</strong></td>
<td>調べるべき項目を落とす</td>
<td>この後</td>
</tr>
<tr>
<td><strong>② 対象の選び方</strong></td>
<td>カバレッジ／選択バイアス／無回答</td>
<td><strong>第10回</strong></td>
</tr>
<tr>
<td><strong>③ 調査票の作り方</strong></td>
<td>質問文・選択肢・順序・構成</td>
<td><strong>今日の前半</strong></td>
</tr>
<tr>
<td><strong>④ 実査</strong></td>
<td>調査員による差、回答者の偽り</td>
<td>この後</td>
</tr>
<tr>
<td><strong>⑤ 記入・回収</strong></td>
<td>記入ミス、読み取りミス</td>
<td>この後</td>
</tr>
<tr>
<td><strong>⑥ コーディング</strong></td>
<td>自由回答を分類するときの揺れ</td>
<td>この後</td>
</tr>
<tr>
<td><strong>⑦ 集計・公表</strong></td>
<td>調査機関の中立性、都合のよい切り出し</td>
<td><strong>第5回・第8回</strong></td>
</tr>
</tbody>
</table>
<footer>小野原 彩香</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="20" data-paginate="true" data-header="社会調査入門｜北星学園大学 2026年度後期" data-footer="小野原 彩香" data-theme="default" lang="ja-JP" data-marpit-pagination="20" style="--paginate:true;--header:社会調査入門｜北星学園大学 2026年度後期;--footer:小野原 彩香;--theme:default;" data-marpit-pagination-total="34">
<header>社会調査入門｜北星学園大学 2026年度後期</header>
<h2 id="%E2%91%A0-%E8%A8%88%E7%94%BB%E3%81%AE%E4%B8%8D%E5%82%99-%E2%80%95%E2%80%95-%E3%81%84%E3%81%A1%E3%81%B0%E3%82%93%E5%8F%96%E3%82%8A%E8%BF%94%E3%81%97%E3%81%8C%E3%81%A4%E3%81%8B%E3%81%AA%E3%81%84">① 計画の不備 ―― いちばん取り返しがつかない</h2>
<p>集め終わってから「あの項目も聞いておけばよかった」と気づく<br />
→ <strong>後からどうにもならない</strong></p>
<blockquote>
<p>通学時間を聞いたが、<strong>通学手段</strong>を聞き忘れた。<br />
「通学時間が長い学生は授業の満足度が低い」という結果が出たが、<br />
徒歩20分と電車20分を区別できないので、<strong>何が効いているのか言えない</strong></p>
</blockquote>
<br />
<h3 id="%E5%AF%BE%E7%AD%96%E3%81%93%E3%81%AE%E7%B5%90%E6%9E%9C%E3%81%8C%E5%87%BA%E3%81%9F%E3%82%89%E4%BD%95%E3%81%8C%E8%A8%80%E3%81%88%E3%82%8B%E3%81%8B%E3%82%92%E5%85%88%E3%81%AB%E6%9B%B8%E3%81%84%E3%81%A6%E3%81%BF%E3%82%8B">対策：「この結果が出たら何が言えるか」を先に書いてみる</h3>
<p>書けなければ、聞くべき項目が足りていない</p>
<footer>小野原 彩香</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="21" data-paginate="true" data-header="社会調査入門｜北星学園大学 2026年度後期" data-footer="小野原 彩香" data-theme="default" lang="ja-JP" data-marpit-pagination="21" style="--paginate:true;--header:社会調査入門｜北星学園大学 2026年度後期;--footer:小野原 彩香;--theme:default;" data-marpit-pagination-total="34">
<header>社会調査入門｜北星学園大学 2026年度後期</header>
<h2 id="%E2%91%A3-%E8%AA%BF%E6%9F%BB%E5%93%A1%E3%81%AB%E3%82%88%E3%82%8B%E8%AA%A4%E5%B7%AE%E3%83%BB%E5%9B%9E%E7%AD%94%E8%80%85%E3%81%AB%E3%82%88%E3%82%8B%E8%AA%A4%E5%B7%AE">④ 調査員による誤差・回答者による誤差</h2>
<h3 id="%E8%AA%BF%E6%9F%BB%E5%93%A1">調査員</h3>
<p>同じ質問文でも、読み上げ方・補足の言い方・表情が人によって違う<br />
複数人で分担すると、<strong>担当した調査員ごとに結果が違う</strong>ことがある（調査員効果）</p>
<h3 id="%E5%9B%9E%E7%AD%94%E8%80%85">回答者</h3>
<ul>
<li>嘘を教える、見栄を張る</li>
<li>答えの揺れ（同じ人が2週間後に別のことを答える）</li>
<li>面倒になって全部③を選ぶ（<strong>ストレートライニング</strong>）</li>
</ul>
<footer>小野原 彩香</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="22" data-paginate="true" data-header="社会調査入門｜北星学園大学 2026年度後期" data-footer="小野原 彩香" data-theme="default" lang="ja-JP" data-marpit-pagination="22" style="--paginate:true;--header:社会調査入門｜北星学園大学 2026年度後期;--footer:小野原 彩香;--theme:default;" data-marpit-pagination-total="34">
<header>社会調査入門｜北星学園大学 2026年度後期</header>
<h2 id="%E2%91%A4-%E3%81%8A%E3%81%8B%E3%81%97%E3%81%84%E3%81%A8%E8%A6%8B%E3%81%88%E3%81%9F%E3%82%82%E3%81%AE%E3%82%92%E5%8B%9D%E6%89%8B%E3%81%AB%E7%9B%B4%E3%81%95%E3%81%AA%E3%81%84">⑤ 「おかしい」と見えたものを、勝手に直さない</h2>
<table>
<thead>
<tr>
<th>調査票に書かれていたこと</th>
<th>ありうる解釈</th>
</tr>
</thead>
<tbody>
<tr>
<td>性別「男」／職業「主婦」</td>
<td>入力ミスか？ それとも <strong>男性の家事従業者</strong> か？</td>
</tr>
<tr>
<td>氏名「佐藤 三雄」／性別「女性」</td>
<td>チェックのミスか？ それとも <strong>「みお」と読む女性</strong> か？</td>
</tr>
</tbody>
</table>
<p>「ミスだろう」と判断して直せば、<strong>本当のデータを壊す</strong></p>
<p>「主婦は女性」「三雄は男性」という前提は、<strong>調査する側が持ち込んだもの</strong></p>
<footer>小野原 彩香</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="23" data-paginate="true" data-header="社会調査入門｜北星学園大学 2026年度後期" data-footer="小野原 彩香" data-theme="default" lang="ja-JP" data-marpit-pagination="23" style="--paginate:true;--header:社会調査入門｜北星学園大学 2026年度後期;--footer:小野原 彩香;--theme:default;" data-marpit-pagination-total="34">
<header>社会調査入門｜北星学園大学 2026年度後期</header>
<h2 id="%E2%91%A4-%E6%AD%A3%E3%81%97%E3%81%84%E6%89%8B%E7%B6%9A%E3%81%8D">⑤ 正しい手続き</h2>
<ol>
<li><strong>直さずに記録を残す</strong>（元の回答を保存する）</li>
<li><strong>確認できるなら確認する</strong>（再接触、原票の照合）</li>
<li>確認できないなら、<strong>どちらとも決めずに「不明」として扱い、その扱いを報告に書く</strong></li>
</ol>
<br />
<blockquote>
<p>第2回「史料に書かれていることと、それが事実であることは別に扱う」と同じ構え</p>
</blockquote>
<h3 id="%E5%8B%9D%E6%89%8B%E3%81%AB%E5%9F%8B%E3%82%81%E3%81%AA%E3%81%84%E7%9B%B4%E3%81%97%E3%81%9F%E3%81%A8%E3%81%8D%E3%81%AF%E7%9B%B4%E3%81%97%E3%81%9F%E3%81%A8%E6%9B%B8%E3%81%8F">勝手に埋めない。直したときは、直したと書く</h3>
<footer>小野原 彩香</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="24" data-paginate="true" data-header="社会調査入門｜北星学園大学 2026年度後期" data-footer="小野原 彩香" data-theme="default" lang="ja-JP" data-marpit-pagination="24" style="--paginate:true;--header:社会調査入門｜北星学園大学 2026年度後期;--footer:小野原 彩香;--theme:default;" data-marpit-pagination-total="34">
<header>社会調査入門｜北星学園大学 2026年度後期</header>
<h2 id="%E2%91%A5-%E3%82%B3%E3%83%BC%E3%83%87%E3%82%A3%E3%83%B3%E3%82%B0%E3%81%AE%E8%AA%A4%E5%B7%AE">⑥ コーディングの誤差</h2>
<p><strong>コーディング</strong>＝自由回答や職業などを、あらかじめ決めたカテゴリに分類して符号を与える作業</p>
<blockquote>
<p>「バイトでコンビニの店番をしています」は<br />
「販売従事者」か「サービス職業従事者」か？</p>
</blockquote>
<p>同じ回答でも、<strong>分類する人によって別のカテゴリ</strong>に入ることがある</p>
<h3 id="%E5%AF%BE%E5%87%A6">対処</h3>
<ul>
<li><strong>分類の基準（コーディングルール）を文書にする</strong></li>
<li><strong>同じ回答を2人が別々に分類して、一致率を確かめる</strong>（→ 第13回の信頼性）</li>
<li>迷った事例を記録し、ルールを更新する</li>
</ul>
<footer>小野原 彩香</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="25" data-paginate="true" data-header="社会調査入門｜北星学園大学 2026年度後期" data-footer="小野原 彩香" data-theme="default" lang="ja-JP" data-marpit-pagination="25" style="--paginate:true;--header:社会調査入門｜北星学園大学 2026年度後期;--footer:小野原 彩香;--theme:default;" data-marpit-pagination-total="34">
<header>社会調査入門｜北星学園大学 2026年度後期</header>
<h2 id="%E2%91%A6-%E9%9B%86%E8%A8%88%E3%83%BB%E5%85%AC%E8%A1%A8%E3%81%AE%E6%AE%B5%E9%9A%8E-%E2%80%95%E2%80%95-%E8%AA%B0%E3%81%8C%E8%AA%BF%E6%9F%BB%E3%81%97%E3%81%9F%E3%81%8B">⑦ 集計・公表の段階 ―― 誰が調査したか</h2>
<ul>
<li>業界団体が自社製品に有利な設問・集計を選ぶ</li>
<li>不都合な項目を公表しない</li>
<li>同じデータから、都合のよい切り口だけを出す</li>
</ul>
<br />
<p>第5回「2次データを使う前に確認する4点」の <strong>③調査主体</strong> がこれ</p>
<h3 id="%E6%95%B0%E5%AD%97%E3%81%8C%E6%AD%A3%E3%81%97%E3%81%8F%E3%81%A6%E3%82%82%E4%BD%95%E3%82%92%E8%81%9E%E3%81%8B%E3%81%AA%E3%81%8B%E3%81%A3%E3%81%9F%E3%81%8B%E3%83%BB%E4%BD%95%E3%82%92%E5%87%BA%E3%81%95%E3%81%AA%E3%81%8B%E3%81%A3%E3%81%9F%E3%81%8B%E3%81%AF%E6%95%B0%E5%AD%97%E3%81%AB%E7%8F%BE%E3%82%8C%E3%81%AA%E3%81%84">数字が正しくても、何を聞かなかったか・何を出さなかったかは数字に現れない</h3>
<footer>小野原 彩香</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="26" data-paginate="true" data-header="社会調査入門｜北星学園大学 2026年度後期" data-footer="小野原 彩香" data-theme="default" lang="ja-JP" data-marpit-pagination="26" style="--paginate:true;--header:社会調査入門｜北星学園大学 2026年度後期;--footer:小野原 彩香;--theme:default;" data-marpit-pagination-total="34">
<header>社会調査入門｜北星学園大学 2026年度後期</header>
<h2 id="%E5%85%A8%E9%83%A8%E3%82%92%E6%B6%88%E3%81%99%E3%81%93%E3%81%A8%E3%81%AF%E3%81%A7%E3%81%8D%E3%81%AA%E3%81%84%E3%81%A0%E3%81%8B%E3%82%89%E6%9B%B8%E3%81%8F">全部を消すことはできない。だから「書く」</h2>
<p>非標本誤差をゼロにする方法はない。できるのは2つだけ</p>
<ol>
<li><strong>工程ごとに、入りやすい誤差に手を打つ</strong><br />
（プリテスト、コーディングルール、調査員の訓練）</li>
<li><strong>残った限界を報告に書く</strong><br />
（回収率、無回答の扱い、コーディングの判断、聞かなかったこと）</li>
</ol>
<br />
<blockquote>
<p>第3回の課題で「改善しても残る限界」を書かせたのと同じ</p>
</blockquote>
<h3 id="%E9%99%90%E7%95%8C%E3%82%92%E6%9B%B8%E3%81%84%E3%81%9F%E8%AA%BF%E6%9F%BB%E3%81%AE%E3%81%BB%E3%81%86%E3%81%8C%E4%BF%A1%E9%A0%BC%E3%81%A7%E3%81%8D%E3%82%8B">限界を書いた調査のほうが信頼できる</h3>
<footer>小野原 彩香</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="27" data-paginate="true" data-header="社会調査入門｜北星学園大学 2026年度後期" data-footer="小野原 彩香" data-theme="default" lang="ja-JP" data-marpit-pagination="27" style="--paginate:true;--header:社会調査入門｜北星学園大学 2026年度後期;--footer:小野原 彩香;--theme:default;" data-marpit-pagination-total="34">
<header>社会調査入門｜北星学園大学 2026年度後期</header>
<h2 id="9-%E3%83%97%E3%83%AA%E3%83%86%E3%82%B9%E3%83%88%E4%BA%88%E5%82%99%E8%AA%BF%E6%9F%BB%E3%81%AE%E9%87%8D%E8%A6%81%E6%80%A7">9. プリテスト（予備調査）の重要性</h2>
<p><strong>プリテスト（pilot study）</strong>：本調査の前に小規模で試験的に実施する調査</p>
<h3 id="%E7%9B%AE%E7%9A%84">目的</h3>
<ul>
<li>質問文の意味が正確に伝わるかを確認する</li>
<li>回答にかかる時間を計測する</li>
<li>誤字・選択肢の漏れを発見する</li>
<li>回収率を予測する</li>
</ul>
<h3 id="%E6%96%B9%E6%B3%95">方法</h3>
<ul>
<li>対象者と同様のプロフィールを持つ人に試験的に回答してもらう</li>
<li>回答後にインタビューし、質問の解釈を確認する（cognitive interview）</li>
<li><strong>最低でも10〜20名</strong>に実施することが推奨される</li>
</ul>
<blockquote>
<p><strong>「プリテストをしない調査は、翻訳を確認しない翻訳と同じだ」</strong>（Fowler, 2014）</p>
</blockquote>
<footer>小野原 彩香</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="28" data-paginate="true" data-header="社会調査入門｜北星学園大学 2026年度後期" data-footer="小野原 彩香" data-theme="default" lang="ja-JP" data-marpit-pagination="28" style="--paginate:true;--header:社会調査入門｜北星学園大学 2026年度後期;--footer:小野原 彩香;--theme:default;" data-marpit-pagination-total="34">
<header>社会調査入門｜北星学園大学 2026年度後期</header>
<h2 id="10-%E5%AE%9F%E9%9A%9B%E3%81%AE%E8%AA%BF%E6%9F%BB%E7%A5%A8%E3%82%92%E8%AA%AD%E3%82%80%E5%86%85%E9%96%A3%E5%BA%9C%E6%B6%88%E8%B2%BB%E8%80%85%E6%84%8F%E8%AD%98%E8%AA%BF%E6%9F%BB">10. 実際の調査票を読む：内閣府消費者意識調査</h2>
<p><strong>「消費者意識に関する基本調査」（内閣府消費者庁）</strong></p>
<h3 id="%E8%AA%BF%E6%9F%BB%E3%81%AE%E6%A6%82%E8%A6%81">調査の概要</h3>
<ul>
<li>目的：消費者の意識・行動・満足度を把握</li>
<li>対象：全国18歳以上の男女（無作為抽出）</li>
<li>方法：郵送調査</li>
<li>主な質問：消費生活全般の満足度、消費者問題の認知、デジタル消費行動</li>
</ul>
<h3 id="%E8%AA%AD%E3%81%BF%E6%96%B9%E3%81%AE%E3%83%9D%E3%82%A4%E3%83%B3%E3%83%88">読み方のポイント</h3>
<ol>
<li>調査の目的と主体は何か？（誰のための調査か）</li>
<li>対象者と抽出方法は適切か？</li>
<li>質問文は中立的か？</li>
<li>回答の選択肢は網羅的かつ排他的か（MECE）？</li>
</ol>
<footer>小野原 彩香</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="29" data-paginate="true" data-header="社会調査入門｜北星学園大学 2026年度後期" data-footer="小野原 彩香" data-theme="default" lang="ja-JP" data-marpit-pagination="29" style="--paginate:true;--header:社会調査入門｜北星学園大学 2026年度後期;--footer:小野原 彩香;--theme:default;" data-marpit-pagination-total="34">
<header>社会調査入門｜北星学園大学 2026年度後期</header>
<h2 id="%E3%83%87%E3%82%A3%E3%82%B9%E3%82%AB%E3%83%83%E3%82%B7%E3%83%A7%E3%83%B3%E6%BC%94%E7%BF%92%E8%B3%AA%E5%95%8F%E6%96%87%E3%81%AE%E8%A9%95%E4%BE%A1">ディスカッション演習：質問文の評価</h2>
<p>以下の質問文について、<strong>問題点を指摘し、改善案を提示してください</strong>（グループ討議 10分）。</p>
<footer>小野原 彩香</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="30" data-paginate="true" data-header="社会調査入門｜北星学園大学 2026年度後期" data-footer="小野原 彩香" data-theme="default" lang="ja-JP" data-marpit-pagination="30" style="--paginate:true;--header:社会調査入門｜北星学園大学 2026年度後期;--footer:小野原 彩香;--theme:default;" data-marpit-pagination-total="34">
<header>社会調査入門｜北星学園大学 2026年度後期</header>
<p><strong>問1.</strong><br />
「最近、環境問題への関心が高まっているなか、あなたはゴミの分別をきちんと行っていますか？」</p>
<p><strong>問2.</strong><br />
「あなたはどのくらいの頻度で運動をしますか？また、食事制限はしていますか？」</p>
<p><strong>問3.</strong><br />
「この授業はわかりやすくなかったとは言えないと思いますか？」</p>
<footer>小野原 彩香</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="31" data-paginate="true" data-header="社会調査入門｜北星学園大学 2026年度後期" data-footer="小野原 彩香" data-theme="default" lang="ja-JP" data-marpit-pagination="31" style="--paginate:true;--header:社会調査入門｜北星学園大学 2026年度後期;--footer:小野原 彩香;--theme:default;" data-marpit-pagination-total="34">
<header>社会調査入門｜北星学園大学 2026年度後期</header>
<p>それぞれ何が問題で、どう書き直せば良いかをグループでまとめてください。</p>
<footer>小野原 彩香</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="32" data-paginate="true" data-header="社会調査入門｜北星学園大学 2026年度後期" data-footer="小野原 彩香" data-theme="default" lang="ja-JP" data-marpit-pagination="32" style="--paginate:true;--header:社会調査入門｜北星学園大学 2026年度後期;--footer:小野原 彩香;--theme:default;" data-marpit-pagination-total="34">
<header>社会調査入門｜北星学園大学 2026年度後期</header>
<h2 id="%E6%9C%AC%E6%97%A5%E3%81%AE%E3%81%BE%E3%81%A8%E3%82%81">本日のまとめ</h2>
<ul>
<li>アンケート調査は<strong>標準化・大規模・定量化</strong>が強みであり、分布や関連の把握に向いている</li>
<li>実施方法（郵送・留置・面接・電話・Web）はそれぞれコスト・回収率・バイアスのトレードオフがある</li>
<li>質問は<strong>閉じた質問と開いた質問</strong>を目的に応じて使い分ける</li>
<li>尺度の種類（名義・順序・間隔・比率）によって使える分析が変わる</li>
<li>リッカート尺度は態度測定に広く使われる。設計には対称性・段階数に注意</li>
<li><strong>ダブルバーレル・誘導質問・二重否定・曖昧な用語</strong>は避ける</li>
<li><strong>標本誤差</strong>は計算できて標本を増やせば小さくなるが、<strong>非標本誤差</strong>は計算できず、標本を増やしても小さくならない</li>
<li>報道の「誤差 ±3%」は<strong>標本誤差だけ</strong></li>
<li>非標本誤差は <strong>①計画 ②対象の選び方 ③調査票 ④実査 ⑤記入・回収 ⑥コーディング ⑦集計・公表</strong> の各工程で入る</li>
<li>矛盾して見える回答を<strong>勝手に直さない</strong>。確認し、できなければ不明として扱い、扱いを報告に書く</li>
<li><strong>プリテスト</strong>は必ず実施して質問文の妥当性を確認する</li>
<li>非標本誤差はゼロにできない。<strong>工程ごとに手を打ち、残った限界を報告に書く</strong></li>
</ul>
<footer>小野原 彩香</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="33" data-paginate="true" data-header="社会調査入門｜北星学園大学 2026年度後期" data-footer="小野原 彩香" data-theme="default" lang="ja-JP" data-marpit-pagination="33" style="--paginate:true;--header:社会調査入門｜北星学園大学 2026年度後期;--footer:小野原 彩香;--theme:default;" data-marpit-pagination-total="34">
<header>社会調査入門｜北星学園大学 2026年度後期</header>
<h2 id="%E6%9C%AC%E6%97%A5%E3%81%AE%E8%AA%B2%E9%A1%8C">本日の課題</h2>
<p><strong>課題：アンケート調査票の設計</strong></p>
<p>あなたが関心を持つ社会的テーマを一つ選び、そのテーマについてアンケート調査票の骨格を設計してください。以下の要件を満たすこと。</p>
<ol>
<li><strong>調査の目的</strong>（2〜3行）：何を明らかにしたいか</li>
<li><strong>対象者と実施方法</strong>：どのような人々を対象に、どの方法で実施するか</li>
<li><strong>質問項目（5問）</strong>：フェイスシート（属性）1〜2問と本質問3〜4問を含めること。閉じた質問を少なくとも2問、リッカート尺度を少なくとも1問使用すること</li>
<li><strong>自己評価</strong>（2〜3行）：自分の質問文の課題・改善余地。<br />
<strong>非標本誤差の発生源（①計画〜⑦公表）のうち、自分の設計でいちばん心配なのはどれか</strong>を挙げ、理由を書く</li>
</ol>
<p><strong>3を書く前に</strong>：「この5問の結果が出たら、自分は何を言えるのか」を1文で書いてみること。<br />
書けなければ、聞くべき項目が足りていません（＝①計画の不備）。</p>
<p>提出字数：300〜500字程度（質問文の記述を含む）<br />
提出期限：次回授業開始前</p>
<footer>小野原 彩香</footer>
</section>
</foreignObject></svg><svg data-marpit-svg="" viewBox="0 0 1280 720"><foreignObject width="1280" height="720"><section id="34" data-paginate="true" data-header="社会調査入門｜北星学園大学 2026年度後期" data-footer="小野原 彩香" data-theme="default" lang="ja-JP" data-marpit-pagination="34" style="--paginate:true;--header:社会調査入門｜北星学園大学 2026年度後期;--footer:小野原 彩香;--theme:default;" data-marpit-pagination-total="34">
<header>社会調査入門｜北星学園大学 2026年度後期</header>
<h2 id="%E6%AC%A1%E5%9B%9E%E4%BA%88%E5%91%8A%E7%AC%AC12%E5%9B%9E">次回予告：第12回</h2>
<p><strong>インタビュー調査の方法と調査例</strong></p>
<ul>
<li>インタビューの種類（構造化・半構造化・非構造化）</li>
<li>インタビューガイドの作成</li>
<li>ラポール形成と傾聴技術</li>
<li>逐語録の作成と倫理的配慮</li>
<li>模擬インタビューのロールプレイ</li>
</ul>
<p><strong>事前準備</strong>：自分が調査したいと思うテーマについて、誰にインタビューしたいかを考えてきてください。</p>
<footer>小野原 彩香</footer>
</section>
